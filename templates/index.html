<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .status {
            margin-bottom: 20px;
            font-size: 1.2em;
            min-height: 30px;
            font-weight: bold;
            color: #667eea;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            color: #333;
        }

        .cell:hover:not(:disabled) {
            background: #f9f9f9;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .cell:disabled {
            cursor: not-allowed;
            opacity: 1;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-reset {
            background: #667eea;
            color: white;
        }

        .btn-reset:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .info {
            margin-top: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 8px;
            color: #666;
            font-size: 0.95em;
        }

        .winner-message {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .cell {
                width: 70px;
                height: 70px;
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic Tac Toe</h1>
        <p class="subtitle">Player (X) vs Computer (O)</p>

        <div class="status" id="status">Your Turn</div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="buttons">
            <button class="btn-reset" onclick="resetGame()">🔄 New Game</button>
        </div>

        <div class="info">
            <p>💡 Click on any empty cell to make your move</p>
            <p>Computer will automatically respond</p>
        </div>
    </div>

    <script>
        let gameActive = true;

        const cells = document.querySelectorAll('.cell');
        const statusDiv = document.getElementById('status');

        function updateBoard(board) {
            cells.forEach((cell, index) => {
                const value = board[index];
                cell.textContent = value === " " ? "" : value;
                cell.classList.remove('x', 'o');
                if (value === "X") cell.classList.add('x');
                if (value === "O") cell.classList.add('o');
            });
        }

        function updateStatus(message, isWinner = false) {
            statusDiv.textContent = message;
            if (isWinner) {
                statusDiv.classList.add('winner-message');
            }
        }

        async function makeMove(index) {
            if (!gameActive || cells[index].textContent !== "") return;

            gameActive = false;
            statusDiv.textContent = "Loading...";

            try {
                const response = await fetch('/api/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ position: index })
                });

                const data = await response.json();
                updateBoard(data.board);

                if (data.game_over) {
                    updateStatus(data.winner, true);
                    gameActive = false;
                } else {
                    updateStatus("Your Turn");
                    gameActive = true;
                }
            } catch (error) {
                console.error('Error:', error);
                updateStatus("Error! Try again.");
                gameActive = true;
            }
        }

        async function resetGame() {
            gameActive = true;
            statusDiv.classList.remove('winner-message');
            statusDiv.textContent = "Your Turn";

            try {
                const response = await fetch('/api/reset', { method: 'POST' });
                const data = await response.json();
                updateBoard(data.board);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                const index = parseInt(cell.dataset.index);
                makeMove(index);
            });
        });

        // Initialize board
        updateBoard([" ", " ", " ", " ", " ", " ", " ", " ", " "]);
    </script>
</body>
</html>
