<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #667eea, #764ba2); }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
        h1 { color: #333; margin: 0 0 20px 0; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; margin: 20px auto; background: #ddd; padding: 5px; }
        .cell { width: 80px; height: 80px; background: white; border: none; font-size: 2em; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .cell:hover { background: #f0f0f0; }
        .status { font-size: 1.2em; margin: 20px 0; min-height: 30px; color: #667eea; font-weight: bold; }
        button { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1em; margin-top: 20px; }
        button:hover { background: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Tic Tac Toe</h1>
        <div class="status" id="status">Your Turn</div>
        <div class="board" id="board"></div>
        <button onclick="resetGame()">New Game</button>
    </div>

    <script>
        const cells = [];
        const board = document.getElementById('board');
        const status = document.getElementById('status');

        // Create board
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('button');
            cell.className = 'cell';
            cell.onclick = () => makeMove(i);
            board.appendChild(cell);
            cells.push(cell);
        }

        function updateDisplay(gameBoard, winner) {
            cells.forEach((cell, i) => {
                cell.textContent = gameBoard[i] === ' ' ? '' : gameBoard[i];
                cell.style.color = gameBoard[i] === 'X' ? '#667eea' : '#764ba2';
            });
            if (winner) {
                status.textContent = winner;
            } else {
                status.textContent = 'Your Turn (X)';
            }
        }

        async function makeMove(pos) {
            if (cells[pos].textContent !== '') return;
            
            status.textContent = 'Loading...';
            
            try {
                const res = await fetch('/move', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pos })
                });
                
                const data = await res.json();
                updateDisplay(data.board, data.winner);
            } catch (e) {
                status.textContent = 'Error!';
            }
        }

        async function resetGame() {
            try {
                const res = await fetch('/reset', { method: 'POST' });
                const data = await res.json();
                updateDisplay(data.board, null);
            } catch (e) {
                alert('Error resetting game');
            }
        }

        // Init
        fetch('/').then(r => r.text()).then(() => {
            updateDisplay(Array(9).fill(' '), null);
        });
    </script>
</body>
</html>
